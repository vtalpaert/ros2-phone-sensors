# Server parameters for bridging cmd_vel and odometry to an Arduino via USB CDC.
# Phone-side cameras stream at low quality to keep bandwidth headroom for USB I/O.
phone_sensors_bridge_server:
  ros__parameters:
    host: "0.0.0.0"
    port: 2000
    debug: false
    secret_key: "secret!"
    ssl_certificate: "certs/certificate.crt"
    ssl_private_key: "certs/private.key"
    use_ros_time: false
    frame_id_image_camera1: "camera1"
    frame_id_image_camera2: "camera2"
    camera1_device_label: "camera 1, facing front"
    camera1_video_fps: 5.0
    camera1_video_width: 320
    camera1_video_height: 240
    camera1_video_compression: 0.2
    camera1_calibration_file: ""
    camera2_device_label: "camera 0, facing back"
    camera2_video_fps: 5.0
    camera2_video_width: 240
    camera2_video_height: 320
    camera2_video_compression: 0.2
    camera2_calibration_file: ""
    usb_enabled: true
    usb_device_type: "cdc"
    usb_baud: 115200
